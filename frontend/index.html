<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hikmat Markaz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <main class="page">
        <section class="hero-card">
            <div class="brand-badge">Hikmat Markaz</div>

            <h1>Healthcare Practice Management</h1>

            <p class="subtitle">
                A centralized platform for doctors, assistants, patients, appointments,
                prescriptions, and financial records.
            </p>

            <div class="status-grid">
                <div class="status-card">
                    <span class="label">Backend Status</span>
                    <strong id="backendStatus">Checking...</strong>
                    <p id="backendMessage">Please wait</p>
                </div>

                <div class="status-card">
                    <span class="label">Database Status</span>
                    <strong id="dbStatus">Checking...</strong>
                    <p id="dbMessage">Please wait</p>
                </div>

                <div class="status-card">
                    <span class="label">Live Sync</span>
                    <strong id="syncStatus">Waiting...</strong>
                    <p id="syncMessage">Runs every 30 seconds</p>
                </div>
            </div>

            <div class="actions">
                <button id="refreshButton">Refresh Status</button>
            </div>
        </section>
    </main>

    <script src="./js/config.js"></script>
    <script src="./js/main.js"></script>
</body>
</html>
