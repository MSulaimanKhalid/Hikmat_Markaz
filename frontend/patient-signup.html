<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Patient Signup - Hikmat Markaz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <main class="landing-page">
        <section class="landing-header">
            <div class="brand-badge">Hikmat Markaz</div>
            <h1>Patient Signup</h1>
            <p class="slogan">
                Create your patient account to view prescriptions and request appointments online.
            </p>
        </section>

        <section class="auth-card wider-auth-card">
            <form id="patientSignupForm">
                <label>CNIC</label>
                <input id="patientSignupCnic" type="text" placeholder="3520212345671" required>

                <label>Full Name</label>
                <input id="patientSignupName" type="text" placeholder="Patient full name" required>

                <label>Gender</label>
                <select id="patientSignupGender">
                    <option value="">Select gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>

                <label>Date of Birth</label>
                <input id="patientSignupDob" type="date">

                <label>Phone</label>
                <input id="patientSignupPhone" type="text" placeholder="03001234567">

                <label>Email Optional</label>
                <input id="patientSignupEmail" type="email" placeholder="patient@example.com">

                <label>Password</label>
                <input id="patientSignupPassword" type="password" placeholder="Minimum 8 characters" required>

                <label>Confirm Password</label>
                <input id="patientSignupConfirmPassword" type="password" placeholder="Repeat password" required>

                <button type="submit">Create Patient Account</button>
            </form>

            <div id="patientSignupResult" class="form-result"></div>

            <div class="back-link-box">
                <a href="./index.html">Back to Login</a>
            </div>
        </section>
    </main>

    <script src="./js/config.js"></script>
    <script src="./js/data-integrity.js"></script>
    <script src="./js/patient-signup.js"></script>
</body>
</html>
